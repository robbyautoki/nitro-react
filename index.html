<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" crossorigin="use-credentials" href="/site.webmanifest">
    <meta name="apple-mobile-web-app-title" content="Bahhos">
    <meta name="application-name" content="Bahhos">
    <meta name="msapplication-TileColor" content="#0a0d14">
    <meta name="theme-color" content="#0a0d14" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <base href="./">
    <title>Bahhos · Hotel</title>
  </head>
  <body>
    <script>if(localStorage.getItem('nitro.theme')!=='light')document.documentElement.classList.add('dark');</script>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root" class="w-full h-full"></div>
    <script>
      const nitroParams = new URLSearchParams(window.location.search);
      const nitroSsoTicket = nitroParams.get('sso');

      if (!nitroSsoTicket) {
        const cmsUrl = window.location.hostname === 'localhost'
          ? 'http://localhost:3030'
          : 'https://www.bahhos.de';

        window.location.replace(`${cmsUrl}/login?redirect_url=/hotel`);
      }

      const NitroConfig = {
        "config.urls": [ '/renderer-config.json', '/ui-config.json' ],
        "sso.ticket": nitroSsoTicket,
        "forward.type": (nitroParams.get('room') ? 2 : -1),
        "forward.id": (nitroParams.get('room') || 0),
        "friend.id": (nitroParams.get('friend') || 0),
      };
    </script>
    <script type="module" src="./src/index.tsx"></script>
  </body>
</html>
